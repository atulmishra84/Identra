server:
  port: 8094

spring:
  application:
    name: identity-core-service
  datasource:
    url: ${IDENTRA_DB_URL:jdbc:postgresql://localhost:5432/identra}
    username: ${IDENTRA_DB_USER:identra}
    password: ${IDENTRA_DB_PASSWORD:identra}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_identity_core_history
