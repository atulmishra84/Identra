spring:
  application:
    name: api-gateway

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

identra:
  security:
    jwt-required: ${IDENTRA_JWT_REQUIRED:false}
    issuer-uri: ${IDENTRA_OIDC_ISSUER:}
    jwk-set-uri: ${IDENTRA_OIDC_JWKS:}
    audience: ${IDENTRA_OIDC_AUDIENCE:identra-api}
  routes:
    identity: ${IDENTRA_IDENTITY_URL:http://localhost:8081}
    provisioning: ${IDENTRA_PROVISIONING_URL:http://localhost:8082}
    tenant: ${IDENTRA_TENANT_URL:http://localhost:8083}
    audit: ${IDENTRA_AUDIT_URL:http://localhost:8084}
    adapters: ${IDENTRA_ADAPTERS_URL:http://localhost:8085}
    approvals: ${IDENTRA_APPROVAL_URL:http://localhost:8086}
    ai: ${IDENTRA_AI_GATEWAY_URL:http://localhost:8091}
    governance: ${IDENTRA_GOVERNANCE_URL:http://localhost:8092}
    connectorFactory: ${IDENTRA_CONNECTOR_FACTORY_URL:http://localhost:8093}
    identityCore: ${IDENTRA_IDENTITY_CORE_URL:http://localhost:8094}
    migration: ${IDENTRA_MIGRATION_URL:http://localhost:8095}
    marketplace: ${IDENTRA_MARKETPLACE_URL:http://localhost:8096}
    automationFactory: ${IDENTRA_AUTOMATION_FACTORY_URL:http://localhost:8097}
    automationRuntime: ${IDENTRA_AUTOMATION_RUNTIME_URL:http://localhost:8098}
    certification: ${IDENTRA_CERTIFICATION_URL:http://localhost:8099}
