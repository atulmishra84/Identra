server:
  port: 8091

spring:
  application:
    name: ai-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info

identra:
  ai:
    default-provider: ${IDENTRA_AI_DEFAULT_PROVIDER:local}
    token-budget: ${IDENTRA_AI_TOKEN_BUDGET:100000}
    airgap-enabled: ${IDENTRA_AI_AIRGAP_ENABLED:false}
    airgap-endpoint: ${IDENTRA_AI_AIRGAP_ENDPOINT:http://llm.internal:8080}
