server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTRA_DB_URL:jdbc:postgresql://localhost:5432/identra}
    username: ${IDENTRA_DB_USER:identra}
    password: ${IDENTRA_DB_PASSWORD:identra}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{tenantId:-},%X{correlationId:-}]"

identra:
  cache:
    identity-ttl-seconds: 60
