server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTRA_DB_URL:jdbc:postgresql://localhost:5432/identra}
    username: ${IDENTRA_DB_USER:identra}
    password: ${IDENTRA_DB_PASSWORD:identra}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_identity_history
  jackson:
    serialization:
      write-dates-as-timestamps: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

identra:
  cache:
    redis-enabled: false
    identity-ttl-seconds: 60

---
spring:
  config:
    activate:
      on-profile: redis
  autoconfigure:
    exclude: []
  data:
    redis:
      host: ${IDENTRA_REDIS_HOST:localhost}
      port: ${IDENTRA_REDIS_PORT:6379}

identra:
  cache:
    redis-enabled: true
