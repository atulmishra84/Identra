name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build libraries and MVP services
        run: ./gradlew build --no-daemon
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: "**/build/reports/**"

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI presence
        run: |
          test -f docs/openapi/identra-public-v1.yaml
          test -f docs/openapi/identra-scim-v2.yaml
          test -f docs/openapi/identra-admin-v1.yaml

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install and lint portal (when lockfile exists)
        run: |
          if [ -f ../../pnpm-lock.yaml ]; then
            cd ../.. && pnpm install --frozen-lockfile
            pnpm --filter @identra/portal-web lint
          else
            npm install
            npm run lint || true
          fi
