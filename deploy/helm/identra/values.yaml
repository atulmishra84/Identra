fullnameOverride: "identra"

image:
  registry: identra.azurecr.io
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

global:
  environment: azure-dev
  tenantProfile: saas-shared

# Probe path used by all Spring Boot services (actuator)
healthPath: /actuator/health

services:
  api-gateway:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8080
    serviceType: LoadBalancer
  identity-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8081
  provisioning-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8082
  tenant-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8083
  audit-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8084
  adapter-runtime:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8085
  approval-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8086
  ai-gateway:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8091
  governance-service:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8092
  connector-factory:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8093
  identity-core-service:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8094
  migration-service:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8095
  marketplace-service:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8096
  automation-factory:
    enabled: true
    versionTrack: v3
    replicaCount: 1
    port: 8097
  automation-runtime:
    enabled: true
    versionTrack: v3
    replicaCount: 1
    port: 8098
  certification-service:
    enabled: true
    versionTrack: v3
    replicaCount: 1
    port: 8099

portal:
  enabled: true
  replicaCount: 1
  port: 3000
  servicePort: 80
  serviceType: LoadBalancer
  # In-cluster gateway service used by Next.js rewrites
  gatewayUrl: http://identra-api-gateway:8080

ingress:
  enabled: false
  className: nginx
  host: identra.example.com
  tls: false

postgresql:
  jdbcUrl: ""
  username: identra
  existingSecret: identra-db

redis:
  host: ""
  port: "6380"
  ssl: "true"
  existingSecret: identra-redis

kafka:
  bootstrapServers: ""

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
