{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identra.fullname" $ }}-{{ $name }}
  labels:
    {{- include "identra.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    identra.io/version-track: {{ $svc.versionTrack | default "v1" | quote }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "identra.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        identra.io/version-track: {{ $svc.versionTrack | default "v1" | quote }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "identra.fullname" $ }}-config
            - secretRef:
                name: {{ $.Values.postgresql.existingSecret }}
                optional: true
            - secretRef:
                name: {{ $.Values.redis.existingSecret }}
                optional: true
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ $.Values.healthPath }}
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ $.Values.healthPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "identra.fullname" $ }}-{{ $name }}
  labels:
    {{- include "identra.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $svc.serviceType | default "ClusterIP" }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
{{- end }}
