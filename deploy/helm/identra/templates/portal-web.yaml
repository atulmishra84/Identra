{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identra.fullname" . }}-portal-web
  labels:
    {{- include "identra.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal-web
    identra.io/version-track: "ui"
spec:
  replicas: {{ .Values.portal.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: portal-web
  template:
    metadata:
      labels:
        {{- include "identra.labels" . | nindent 8 }}
        app.kubernetes.io/component: portal-web
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: portal-web
          image: "{{ .Values.image.registry }}/portal-web:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.portal.port }}
              name: http
          env:
            - name: IDENTRA_GATEWAY_URL
              value: {{ .Values.portal.gatewayUrl | quote }}
            - name: PORT
              value: {{ .Values.portal.port | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "identra.fullname" . }}-portal-web
  labels:
    {{- include "identra.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal-web
spec:
  type: {{ .Values.portal.serviceType }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: portal-web
  ports:
    - name: http
      port: {{ .Values.portal.servicePort }}
      targetPort: http
{{- end }}
