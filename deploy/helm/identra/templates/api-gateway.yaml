apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identra.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: {{ .Values.services.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api-gateway
          image: "{{ .Values.image.registry }}/api-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.apiGateway.port }}
          envFrom:
            - configMapRef:
                name: {{ include "identra.fullname" . }}-config
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.apiGateway.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "identra.fullname" . }}-gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - port: {{ .Values.services.apiGateway.port }}
      targetPort: {{ .Values.services.apiGateway.port }}
