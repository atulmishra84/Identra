{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "identra.fullname" . }}
  labels:
    {{- include "identra.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "identra.fullname" . }}-api-gateway
                port:
                  number: {{ (index .Values.services "api-gateway").port }}
{{- end }}
