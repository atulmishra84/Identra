# Production overlay for Identra on Azure AKS
# Domain: identra.idenaccess.com (point DNS A record after ingress IP is known)

fullnameOverride: "identra"

image:
  registry: identrag6kify.azurecr.io
  tag: "0.3.0"
  pullPolicy: Always

global:
  environment: azure-prod
  tenantProfile: saas-shared

healthPath: /actuator/health

services:
  api-gateway:
    enabled: true
    versionTrack: v1
    replicaCount: 2
    port: 8080
    serviceType: ClusterIP
  identity-service:
    enabled: true
    versionTrack: v1
    replicaCount: 2
    port: 8081
  provisioning-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8082
  tenant-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8083
  audit-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8084
  adapter-runtime:
    enabled: true
    versionTrack: v1
    replicaCount: 2
    port: 8085
  approval-service:
    enabled: true
    versionTrack: v1
    replicaCount: 1
    port: 8086
  ai-gateway:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8091
  governance-service:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8092
  connector-factory:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8093
  identity-core-service:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8094
  migration-service:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8095
  marketplace-service:
    enabled: true
    versionTrack: v2
    replicaCount: 1
    port: 8096
  automation-factory:
    enabled: true
    versionTrack: v3
    replicaCount: 1
    port: 8097
  automation-runtime:
    enabled: true
    versionTrack: v3
    replicaCount: 1
    port: 8098
  certification-service:
    enabled: true
    versionTrack: v3
    replicaCount: 1
    port: 8099

portal:
  enabled: true
  replicaCount: 2
  port: 3000
  servicePort: 80
  serviceType: ClusterIP
  gatewayUrl: http://identra-api-gateway:8080

ingress:
  enabled: true
  className: nginx
  host: identra.idenaccess.com
  tls: true
  # Keep false until DNS points to ingress; then set "true" and re-upgrade
  sslRedirect: "false"
  clusterIssuer: letsencrypt-prod
  tlsSecretName: identra-tls

# Security (flip jwtRequired to true after Entra app registration)
security:
  jwtRequired: "false"
  oidcIssuer: "https://login.microsoftonline.com/7a570fd1-8a60-4115-9e1b-68f9102f4eab/v2.0"
  oidcJwks: "https://login.microsoftonline.com/7a570fd1-8a60-4115-9e1b-68f9102f4eab/discovery/v2.0/keys"
  oidcAudience: "identra-api"

postgresql:
  jdbcUrl: ""
  username: identra
  existingSecret: identra-db

redis:
  host: ""
  port: "6380"
  ssl: "true"
  existingSecret: identra-redis

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
